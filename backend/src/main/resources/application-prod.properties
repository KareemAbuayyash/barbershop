server.servlet.session.cookie.secure=true

# Production never connects as PostgreSQL's superuser. Keep the runtime role
# separate from the migration role so an application compromise cannot DDL.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_MIGRATOR_USERNAME}
spring.flyway.password=${DB_MIGRATOR_PASSWORD}
