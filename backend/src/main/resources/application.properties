
spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/barbershop_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

server.port=8080

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${BARBER_SESSION_COOKIE_SECURE:false}
spring.session.jdbc.initialize-schema=never
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
barbershop.push.vapid-public-key=${BARBERSHOP_PUSH_VAPID_PUBLIC_KEY:}
barbershop.push.vapid-private-key=${BARBERSHOP_PUSH_VAPID_PRIVATE_KEY:}
barbershop.push.subject=${BARBERSHOP_PUSH_SUBJECT:mailto:owner@barberhouse.local}

barber.admin.bootstrap-enabled=true

barbershop.security.rate-limit.max-tracked-addresses=10000
barbershop.security.rate-limit.login-max-failures=5
barbershop.security.rate-limit.login-window=15m
barbershop.security.rate-limit.registration-max-attempts=5
barbershop.security.rate-limit.registration-window=15m
barbershop.security.rate-limit.booking-max-attempts=10
barbershop.security.rate-limit.booking-window=10m
